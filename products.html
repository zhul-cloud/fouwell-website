<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting… | Fouwell</title>
  <!-- This file is an orphan left over from the 2026-09-12 directory-structure redesign
       (see wiki/analyses/福唯独立站SEO-GEO解决方案.md) — /products/index.html is the real,
       linked-from-nav catalog page now. Nothing in the site links here anymore.
       .htaccess already has a `RewriteRule ^products\.html$ /products/ [R=301,L]` rule,
       but 2026-09-14 testing found NONE of the .htaccess redirect rules are actually firing
       in production (curl -I on /products.html, /index.html, /about.html all return 200,
       not 301 — even with a cache-busting query string). The server responds `server: nginx`,
       and nginx does not read .htaccess (that's an Apache/LiteSpeed-only mechanism) — so
       whatever is actually fronting fouwell.com right now is not applying these rules,
       making the whole .htaccess file dead configuration until that's sorted out at the
       hosting/proxy level (outside what a file deploy can fix). This page redirects itself
       client-side instead, which works regardless of that unresolved server-side question. -->
  <link rel="canonical" href="https://fouwell.com/products/">
  <meta http-equiv="refresh" content="0; url=/products/">
  <script>location.replace('/products/');</script>
</head>
<body>
  <p>This page has moved. Redirecting to <a href="/products/">our product catalog</a>…</p>
</body>
</html>

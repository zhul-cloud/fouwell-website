name: DEBUG secret roundtrip (throwaway)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruct and hash
        run: |
          printf '%s\n' "${{ secrets.TEST_ROUNDTRIP }}" > /tmp/reconstructed.txt
          echo "expected sha256: 9e5fe908f700b354f6edef323e7eeb83419d1e6a7b17e827b47e4064d778b578"
          echo "actual sha256:"
          sha256sum /tmp/reconstructed.txt
          echo "byte count:"
          wc -c /tmp/reconstructed.txt
          echo "hexdump (safe, this is dummy test data not a real credential):"
          od -c /tmp/reconstructed.txt | head -20
